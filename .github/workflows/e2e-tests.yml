name: PayBuddy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

# Set permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VITE_FIREBASE_API_KEY: 'AIzaSyADk2YxrASsShKpKcFda5sB-AkzO8L_Vts'
  VITE_FIREBASE_AUTH_DOMAIN: 'paybuddy-2df9a.firebaseapp.com'
  VITE_FIREBASE_PROJECT_ID: 'paybuddy-2df9a'
  VITE_FIREBASE_STORAGE_BUCKET: 'paybuddy-2df9a.firebasestorage.app'
  VITE_FIREBASE_MESSAGING_SENDER_ID: '113844888362'
  VITE_FIREBASE_APP_ID: '1:113844888362:web:724656b24547aae2a47453'

jobs:
  test:
    name: Build and Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Web Application
        run: |
          npm run build
          # Create copy of index.html as 404.html to support SPA routing on GitHub Pages
          cp dist/index.html dist/404.html

      - name: Install E2E Test Dependencies
        run: |
          cd tests
          npm ci

      - name: Run E2E Selenium Tests
        run: |
          # xvfb-run starts a virtual screen so that Chrome can run visibly inside GitHub Actions
          xvfb-run --auto-servernum npm run test:web

      - name: Upload Excel Test Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: Test-Analysis-Report
          path: tests/reports/Test_Analysis_Report.xlsx
          if-no-files-found: error

      - name: Upload Website Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
