name: Run E2E Tests and Generate Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install E2E Test Dependencies
        run: |
          cd tests
          npm ci

      - name: Run E2E Selenium Tests
        run: |
          # xvfb-run starts a virtual screen so that Chrome can run visibly inside GitHub Actions
          xvfb-run --auto-servernum npm run test:web

      - name: Upload Excel Test Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: Test-Analysis-Report
          path: tests/reports/Test_Analysis_Report.xlsx
          if-no-files-found: error
